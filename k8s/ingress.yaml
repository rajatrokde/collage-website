apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aitae-portal-ingress
  labels:
    app: login-app
    tier: frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: login-web-service
                port:
                  number: 3000
