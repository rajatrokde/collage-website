name: Build & Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Docker Image & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/collage-website
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.${{ github.run_number }}
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "### 🚀 Docker Image Successfully Built & Pushed!" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ secrets.DOCKERHUB_USERNAME }}/collage-website:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version Tag**: \`${{ secrets.DOCKERHUB_USERNAME }}/collage-website:1.0.${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
