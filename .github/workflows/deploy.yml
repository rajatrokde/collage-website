name: Docker CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Docker Image & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME || 'rajatrokde' }}/collage-website:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME || 'rajatrokde' }}/collage-website:1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "### 🚀 Docker Image Successfully Built & Pushed!" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/collage-website:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: \`${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/collage-website:1.0.${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
